packages:
  - 'packages/typings'
  - 'packages/__tests__/units'
  - 'packages/__tests__/types'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

nodeLinker: hoisted
minimumReleaseAge: 300

minimumReleaseAgeExclude:
  - '@bemedev/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  '@vitest/coverage-v8': 5.1.0

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest

  allowedVersions:
    vite: '*'
    vitest: '*'
